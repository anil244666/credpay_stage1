pool:
  vmImage: ubuntu-latest
variables:
  acrserviceconnection: 'acr-service-connection'
  frontendrepository: 'credpay/frontedn'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'
stages:
  - stage: dockerbuild
    displayName: 'Docker Build'
    jobs:
      - job: buildpushimage
        displayName: 'Build and Push Image'
        steps:
          - checkout: self
          - task: Docker@2
            inputs:
              containerRegistry: 'acr-service-connection'
              repository: '$(frontendrepository)'
              command: 'buildAndPush'
              Dockerfile: 'frontend-react/dockerfile'
              buildContext: 'frontend-react'
              tags: |
                $(tag)
                latest
          - task: Docker@2
            inputs:
              containerRegistry: 'acr-service-connection'
              repository: '$(userrepository)'
              command: 'buildAndPush'
              Dockerfile: 'user-service/dockerfile'
              buildContext: 'user-service'
              tags: |
                $(tag)
                latest
          - task: Docker@2
            inputs:
              containerRegistry: 'acr-service-connection'
              repository: '$(paymentrepository)'
              command: 'buildAndPush'
              Dockerfile: 'payment-service/dockerfile'
              buildContext: 'payment-service'
              tags: |
                $(tag)
                latest